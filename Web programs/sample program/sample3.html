<html>
<body>
<h3>Add Two Numbers</h3>
<p id="num1">7</p>
<p id="num2">5</p>
<p id="result"></p>
<script>
let a=Number(document.getElementById('num1').textContent);
let b=Number(document.getElementById('num2').textContent);
let sum = a + b;
document.getElementById('result').textContent="sum:"+sum;
</script>
</body>
</html>
