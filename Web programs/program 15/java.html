<!DOCTYPE html>
<html>
<head>
<title>Writing output in Javascript</title>
</head>
<body>
<h2>Different ways to display output in javascript</h2>
<p id="output"></p>
<script>
document.write("<b>1.Using document.write()</br><br>");
document.write("This text is written directly to the web page<br><br>");
alert("2.This is an alert box message!");
console.log("3.This message appears in the browser console.");
document.getElementById("output").innerHTML="4.This text is added using innerHTML";
</script>
</body>
</html>
