<!DOCTYPE html>
<html>
<head>
<body>
<title>feedback</title>
</body>
<h2><b>FEED BACK FORM<b><h2>
<form action="/submit_feedback" method="post">
<fieldset>
<label for="name">Name:</label>
<input type="text" id="name" name="name" required><br><br>
<label for="email">Email:</label>
<input type="email" id="email" name="email" required<br><br>
rate our service:<br>
<input type="radio" name="rate" value="excellent">Excellent<br>
<input type="radio" name="rate" value="good">Good<br>
<input type="radio" name="rate" value="average">Average<br>
<input type="radio" name="rate" value="bad">Bad<br>
your feedback:<br>
<textarea name="feedback" rows="6"" cols="40">
</textarea><br><br>
<input type="submit" value="submit">
<input type="reset" value="reset">
</fieldset>
</textarea>
</form>
</body>
</html>
